services:
  db:
    image: postgres:16-alpine
    container_name: sgcti-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=SgctiDb
    ports:
      - "5433:5432"
    volumes:
      - pgdata_sgcti:/var/lib/postgresql/data
      - ./db-backup:/docker-entrypoint-initdb.d

  backend:
    build:
      context: .
      dockerfile: src/Sgcti.Api/Dockerfile
    container_name: sgcti-backend
    ports:
      - "5141:8080"
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__SgctiDB=Host=db;Port=5432;Database=SgctiDb;Username=postgres;Password=postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-cendi
      dockerfile: Dockerfile
    container_name: sgcti-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata_sgcti:
